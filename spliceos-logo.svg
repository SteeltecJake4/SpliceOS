<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" role="img" aria-labelledby="title desc">
  <title id="title">SpliceOS</title>
  <desc id="desc">SpliceOS logo: two structural beam ends joined with a bolted splice plate.</desc>
  <rect x="4" y="6" width="88" height="88" rx="20" fill="#203b34"/>
  <!-- Two beam ends meeting at a bolted splice plate. -->
  <path d="M15 25H42V37H35V63H42V75H15Z" fill="#e7eee9"/>
  <path d="M54 25H81V75H54V63H61V37H54Z" fill="#e7eee9"/>
  <path d="M39 18H57V82H39Z" fill="#d4f05b" stroke="#b4d54a" stroke-width="1.5"/>
  <g fill="#203b34" stroke="#f3f5f1" stroke-width="1.5">
    <circle cx="44" cy="39" r="3.4"/><circle cx="52" cy="39" r="3.4"/>
    <circle cx="44" cy="61" r="3.4"/><circle cx="52" cy="61" r="3.4"/>
  </g>
  <text x="111" y="62" fill="#162521" stroke="#162521" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke fill" font-family="Bahnschrift, 'Arial Narrow', Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="1.1">SPLICE<tspan dx="-1" fill="#1e5b4d" stroke="#1e5b4d">OS</tspan></text>
  <text x="114" y="83" fill="#52615b" font-family="Bahnschrift, 'Arial Narrow', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.8">FIELD OPERATIONS</text>
</svg>

